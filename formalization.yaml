scope: Two principal theorems, with their complete proof dependency closure
limitations: Registry mechanical and editorial review are separate checks; no novelty or human peer-review claim is made
provenance_notes: >-
  AItoBit is the public human maintainer name supplied by the submitter.
  The submitter states that they have approval from a responsible author or
  maintainer of the underlying formalization. The approver is not named here.
